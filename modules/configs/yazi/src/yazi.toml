#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
sort_fallback  = "alphabetical"
linemode       = "none"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll", "drag" ]

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
    { run = '${EDITOR:-vi} "$@"', desc = "$EDITOR", block = true },
]
satty = [
    { run = 'satty --filename "$1"', desc = "Edit with Satty", orphan = true },
]
play = [
    { run = 'xdg-open "$1"', desc = "Play", orphan = true },
    { run = 'mediainfo "$1"; echo "Press enter to exit"; read _', block = true, desc = "Show media info" },
]
open = [
    { run = 'xdg-open "$1"', desc = "Open", orphan = true },
]
reveal = [
    { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal" },
    { run = 'clear; exiftool "$1"; echo "Press enter to exit"; read _', block = true, desc = "Show EXIF" },
]
# --- Archiving & Extraction ---
extract = [
    # Uses Yazi's built-in extraction (shows progress bar!)
    { run = 'ya pub extract --list "$@"', desc = "Extract here" },
]
extract_to = [
    # Prompts for a folder name and extracts
    { run = 'printf "Extract to folder: "; read -r DEST </dev/tty && [ -n "$DEST" ] && mkdir -p "$DEST" && 7z x "$1" -o"$DEST"', block = true, desc = "Extract to folder..." },
]
compress = [
    # Standard compression prompt
    { run = 'printf "Archive name (e.g. secret.7z or backup.tar.gz): "; read -r NAME </dev/tty && [ -n "$NAME" ] && 7z a "$NAME" "$@"', block = true, desc = "Archive (Choose format)" },
    # Password protected compression prompt (hides password while typing)
    { run = 'printf "Archive name: "; read -r NAME </dev/tty && printf "Password: "; stty -echo; read -r PASS </dev/tty; stty echo; echo; [ -n "$NAME" ] && [ -n "$PASS" ] && 7z a -p"$PASS" "$NAME" "$@"', block = true, desc = "Archive (Password protection)" },
]
# ------------------------------
download = [
    { run = 'ya emit download --open "$@"', desc = "Download and open" },
    { run = 'ya emit download "$@"',        desc = "Download" },
]
trash = [
    { run = 'ya pub trash-restore --list "$@"', desc = "Restore selected files" },
    { run = 'ya pub trash-empty --list "$@"',   desc = "Empty trash bin" },
]

[open]
rules = [
    # Folder
    { mime = "folder/*", use = [ "edit", "open", "reveal", "compress" ] },
    # Text
    { mime = "text/*", use = [ "edit", "reveal", "compress" ] },
    # Image
    { url = "*.{png,jpg,jpeg,webp,avif,gif,svg,bmp,ico,PNG,JPG,JPEG,WEBP}", use = [ "satty", "open", "reveal", "compress" ] },
    { mime = "image/*", use = [ "satty", "open", "reveal", "compress" ] },
    # Media
    { mime = "{audio,video}/*", use = [ "play", "reveal", "compress" ] },
    # Code
    { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "reveal", "compress" ] },
    # Archive (Extract here is primary)
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal", "compress" ] },
    # Empty file
    { mime = "inode/empty", use = [ "edit", "reveal", "compress" ] },
    # Virtual file system
    { mime = "vfs/{absent,stale}", use = "download" },
    # Trash
    { mime = "trash/**", use = [ "open", "trash" ] },
    # Fallback
    { url = "*", use = [ "open", "reveal", "compress" ] },
]


[tasks]
file_workers     = 3
plugin_workers   = 5
fetch_workers    = 5
preload_workers  = 2
process_workers  = 5
bizarre_retry    = 3
image_alloc      = 536870912  # 512MB
image_bound      = [ 10000, 10000 ]
suppress_preload = false

[plugin]
fetchers = [
    { url = "*/",          run = "mime.dir",    prio = "high", group = "mime" },
    { url = "local://*",  run = "mime.local",  prio = "high", group = "mime" },
    { url = "trash://*",  run = "mime.trash",  prio = "high", group = "mime" },
    { url = "remote://*", run = "mime.remote", prio = "high", group = "mime" },
]
spotters = [
    { mime = "multi/*", run = "multi" },
    { mime = "folder/*", run = "folder" },
    { mime = "text/*", run = "code" },
    { mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
    { mime = "image/{avif,hei?,jxl}", run = "magick" },
    { mime = "image/svg+xml", run = "svg" },
    { mime = "image/*", run = "image" },
    { mime = "video/*", run = "video" },
    { mime = "vfs/*", run = "vfs" },
    { mime = "trash/**", run = "trash" },
    { mime = "null/*", run = "null" },
    { url = "*", run = "file" },
    { url = "*/", run = "file" },
]
preloaders = [
    { mime = "image/{avif,hei?,jxl}", run = "magick" },
    { mime = "image/svg+xml", run = "svg" },
    { mime = "image/*", run = "image" },
    { mime = "video/*", run = "video" },
    { mime = "application/pdf", run = "pdf" },
    { mime = "font/*", run = "font" },
    { mime = "application/ms-opentype", run = "font" },
    { mime = "trash/**", run = "trash" },
]
previewers = [
    { mime = "folder/*", run = "folder" },
    { mime = "text/*", run = "code" },
    { mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
    { mime = "application/{json,ndjson}", run = "json" },
    { mime = "image/{avif,hei?,jxl}", run = "magick" },
    { mime = "image/svg+xml", run = "svg" },
    { mime = "image/*", run = "image" },
    { mime = "video/*", run = "video" },
    { mime = "application/pdf", run = "pdf" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive" },
    { mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive" },
    { url = "*.{AppImage,appimage}", run = "archive" },
    { mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive" },
    { mime = "application/virtualbox-{vhd,vhdx}", run = "archive" },
    { url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive" },
    { mime = "font/*", run = "font" },
    { mime = "application/ms-opentype", run = "font" },
    { mime = "inode/empty", run = "empty" },
    { mime = "vfs/*", run = "vfs" },
    { mime = "trash/**", run = "trash" },
    { mime = "null/*", run = "null" },
    { url = "*", run = "file" },
]

[input]
cursor_blink = false
cd_title      = "Change directory:"
cd_origin     = "top-center"
cd_offset     = [ 0, 2, 50, 3 ]
create_title  = [ "Create:", "Create (dir):" ]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]
rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]
find_title    = [ "Find next:", "Find previous:" ]
find_origin   = "top-center"
find_offset   = [ 0, 2, 50, 3 ]
search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [ 0, 2, 50, 3 ]
shell_title   = [ "Shell:", "Shell (block):" ]
shell_origin  = "top-center"
shell_offset  = [ 0, 2, 50, 3 ]

[confirm]
trash_title      = "Trash {n} selected file{s}?"
trash_origin     = "center"
trash_offset     = [ 0, 0, 70, 20 ]
delete_title     = "Permanently delete {n} selected file{s}?"
delete_origin    = "center"
delete_offset    = [ 0, 0, 70, 20 ]
overwrite_title  = "Overwrite file?"
overwrite_body   = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [ 0, 0, 50, 15 ]
quit_title  = "Quit?"
quit_body   = "There are unfinished tasks, quit anyway?\n(Open task manager with default key 'w')"
quit_origin = "center"
quit_offset = [ 0, 0, 50, 15 ]

[pick]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [ 0, 1, 50, 7 ]

[which]
sort_by        = "none"
sort_sensitive = false
sort_reverse   = false
sort_translit  = false
